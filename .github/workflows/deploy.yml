name: Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: argus_ingest_test
          POSTGRES_PASSWORD: argus-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet fastapi uvicorn[standard] pandas pyarrow \
            fastparquet python-dotenv python-multipart scikit-learn \
            joblib psycopg2-binary ijson pytest httpx boto3 requests

      - name: Run tests
        run: python -m pytest backend/tests/ scripts/tests/ -v --tb=short
        env:
          DEMO_MODE: "true"
          DATABASE_URL: "sqlite-local"

      - name: Test atomic ingestion against isolated PostgreSQL
        run: python -m pytest scripts/tests/test_postgres_ingest.py -v --tb=short
        env:
          DATABASE_URL: "sqlite-local"
          ARGUS_TEST_PG_URL: "postgresql://postgres:argus-test-only@127.0.0.1:55432/argus_ingest_test"

  cloud-training:
    name: Verify offline cloud training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU training environment
        run: |
          pip install --quiet -r scripts/requirements-cloud-training.txt pytest boto3
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
      - name: Verify audited export and training isolation
        run: python -m pytest scripts/tests/test_verified_cloud_training.py scripts/tests/test_clue_training.py -v --tb=short
        env:
          DATABASE_URL: "sqlite-local"

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test Cloudflare authentication target
        run: node --test scripts/tests/cloudflare-demo.test.mjs
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ── Backend → Hugging Face Spaces ────────────────────────────────────────
  # NOTE: Model files (*.pt, *.pkl, *.parquet, *.csv) are gitignored and
  # live on the local `hf-deploy` branch. GitHub Actions cannot push model
  # files automatically. Use the manual command when models change:
  #
  #   git checkout hf-deploy && git rebase master
  #   git push hf-space hf-deploy:main --force
  #   git checkout master
  #
  # This job only runs when triggered manually (workflow_dispatch) or when
  # you want to push a code-only change and model files are already on HF.
  deploy-backend:
    name: Push backend to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'workflow_dispatch'   # manual trigger only

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false        # model files not in GitHub repo

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git remote add hf-space \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push hf-space master:main --force

  # ── Frontend → Vercel ─────────────────────────────────────────────────────
  # Vercel re-deploys automatically on every push to master via GitHub
  # integration — no action needed here.
