version: '3.8'

services:

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ueba
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ueba"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ueba
      DATA_DIR:     /app/data/processed
      DEMO_DIR:     /app/demo
      DEMO_MODE:    ${DEMO_MODE:-false}
      PORT:         8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./demo:/app/demo:ro
    profiles:
      - full   # only start with: docker compose --profile full up

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    profiles:
      - full   # only start with: docker compose --profile full up

volumes:
  pgdata:
